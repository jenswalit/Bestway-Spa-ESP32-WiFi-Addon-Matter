button_card_templates:
  spa_surface:
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: none
    hold_action:
      action: none
    styles:
      card:
        - background: >-
            linear-gradient(145deg, rgba(30,78,111,0.90), rgba(15,51,73,0.92)),
            var(--ha-card-background, var(--card-background-color))
        - border: 1px solid rgba(95,204,242,0.24)
        - border-radius: 28px
        - box-shadow: 0 14px 34px rgba(0,10,20,0.22), inset 0 1px 0 rgba(155,228,255,0.08)
        - overflow: hidden
        - color: '#f4f7fb'
  spa_control:
    show_icon: true
    show_name: true
    show_state: false
    show_label: true
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    variables:
      accent: '#65a8ff'
      accent_rgb: 101,168,255
      label_on: Aan
      label_off: Uit
    name: >-
      [[[

      /* BWC_I18N */

      const __bwcTranslatedResult = (() => {
       return variables.title || entity?.attributes?.friendly_name || ""; 
      })();

      return window.bestwaySpaTranslate ?
      window.bestwaySpaTranslate(__bwcTranslatedResult, hass.locale?.language ||
      hass.language || "nl") : __bwcTranslatedResult;

      ]]]
    label: >-
      [[[

      /* BWC_I18N */

      const __bwcTranslatedResult = (() => {

        if (!entity) return 'Niet beschikbaar';
        if (entity.state === 'unavailable' || entity.state === 'unknown') return 'Niet beschikbaar';
        return entity.state === 'on' ? variables.label_on : variables.label_off;

      })();

      return window.bestwaySpaTranslate ?
      window.bestwaySpaTranslate(__bwcTranslatedResult, hass.locale?.language ||
      hass.language || "nl") : __bwcTranslatedResult;

      ]]]
    styles:
      card:
        - min-height: 124px
        - padding: 18px 16px 15px
        - border-radius: 23px
        - border: >-
            [[[

            /* BWC_I18N */

            const __bwcTranslatedResult = (() => {

              const on = entity && entity.state === 'on';
              return on
                ? `1px solid rgba(${variables.accent_rgb},0.82)`
                : '1px solid rgba(255,255,255,0.10)';

            })();

            return window.bestwaySpaTranslate ?
            window.bestwaySpaTranslate(__bwcTranslatedResult,
            hass.locale?.language || hass.language || "nl") :
            __bwcTranslatedResult;

            ]]]
        - background: >-
            [[[

            /* BWC_I18N */

            const __bwcTranslatedResult = (() => {

              const on = entity && entity.state === 'on';
              if (on) return `linear-gradient(145deg, rgba(${variables.accent_rgb},0.86), rgba(${variables.accent_rgb},0.48) 58%, rgba(6,39,57,0.96))`;
              return 'linear-gradient(155deg, rgba(42,96,129,0.96), rgba(20,58,83,0.99))';

            })();

            return window.bestwaySpaTranslate ?
            window.bestwaySpaTranslate(__bwcTranslatedResult,
            hass.locale?.language || hass.language || "nl") :
            __bwcTranslatedResult;

            ]]]
        - box-shadow: >-
            [[[

            /* BWC_I18N */

            const __bwcTranslatedResult = (() => {

              const on = entity && entity.state === 'on';
              return on
                ? `0 12px 30px rgba(0,8,16,0.34), 0 0 34px rgba(${variables.accent_rgb},0.26), inset 0 1px 0 rgba(255,255,255,0.12)`
                : '0 9px 24px rgba(0,0,0,0.20), inset 0 1px 0 rgba(255,255,255,0.055)';

            })();

            return window.bestwaySpaTranslate ?
            window.bestwaySpaTranslate(__bwcTranslatedResult,
            hass.locale?.language || hass.language || "nl") :
            __bwcTranslatedResult;

            ]]]
        - transition: all 220ms ease
      grid:
        - grid-template-areas: '"i" "n" "l"'
        - grid-template-columns: 1fr
        - grid-template-rows: 54px min-content min-content
      img_cell:
        - width: 52px
        - height: 52px
        - border-radius: 17px
        - justify-self: center
        - background: >-
            [[[

            /* BWC_I18N */

            const __bwcTranslatedResult = (() => {

              const on = entity && entity.state === 'on';
              return on ? `rgba(255,255,255,0.14)` : 'rgba(255,255,255,0.075)';

            })();

            return window.bestwaySpaTranslate ?
            window.bestwaySpaTranslate(__bwcTranslatedResult,
            hass.locale?.language || hass.language || "nl") :
            __bwcTranslatedResult;

            ]]]
        - box-shadow: >-
            [[[

            /* BWC_I18N */

            const __bwcTranslatedResult = (() => {

              const on = entity && entity.state === 'on';
              return on ? `0 0 24px rgba(${variables.accent_rgb},0.26)` : 'none';

            })();

            return window.bestwaySpaTranslate ?
            window.bestwaySpaTranslate(__bwcTranslatedResult,
            hass.locale?.language || hass.language || "nl") :
            __bwcTranslatedResult;

            ]]]
      icon:
        - width: 28px
        - color: >-
            [[[

            /* BWC_I18N */

            const __bwcTranslatedResult = (() => {

              const on = entity && entity.state === 'on';
              return on ? '#ffffff' : 'rgba(205,226,238,0.70)';

            })();

            return window.bestwaySpaTranslate ?
            window.bestwaySpaTranslate(__bwcTranslatedResult,
            hass.locale?.language || hass.language || "nl") :
            __bwcTranslatedResult;

            ]]]
        - filter: >-
            [[[

            /* BWC_I18N */

            const __bwcTranslatedResult = (() => {

              const on = entity && entity.state === 'on';
              return on ? `drop-shadow(0 0 8px rgba(${variables.accent_rgb},0.52))` : 'none';

            })();

            return window.bestwaySpaTranslate ?
            window.bestwaySpaTranslate(__bwcTranslatedResult,
            hass.locale?.language || hass.language || "nl") :
            __bwcTranslatedResult;

            ]]]
      name:
        - margin-top: 11px
        - font-size: 13px
        - font-weight: 700
        - letter-spacing: 0.3px
        - color: rgba(246,248,252,0.94)
      label:
        - margin-top: 4px
        - font-size: 11px
        - font-weight: 600
        - letter-spacing: 0.45px
        - color: >-
            [[[

            /* BWC_I18N */

            const __bwcTranslatedResult = (() => {

              const on = entity && entity.state === 'on';
              return on ? 'rgba(255,255,255,.92)' : 'rgba(188,213,228,0.68)';

            })();

            return window.bestwaySpaTranslate ?
            window.bestwaySpaTranslate(__bwcTranslatedResult,
            hass.locale?.language || hass.language || "nl") :
            __bwcTranslatedResult;

            ]]]
  spa_optional_control:
    show_icon: true
    show_name: true
    show_label: true
    show_state: false
    hidden: >-
      [[[

      /* BWC_I18N */

      const __bwcTranslatedResult = (() => {
       return !states[variables.entity_id]; 
      })();

      return window.bestwaySpaTranslate ?
      window.bestwaySpaTranslate(__bwcTranslatedResult, hass.locale?.language ||
      hass.language || "nl") : __bwcTranslatedResult;

      ]]]
    name: >-
      [[[

      /* BWC_I18N */

      const __bwcTranslatedResult = (() => {
       return variables.title; 
      })();

      return window.bestwaySpaTranslate ?
      window.bestwaySpaTranslate(__bwcTranslatedResult, hass.locale?.language ||
      hass.language || "nl") : __bwcTranslatedResult;

      ]]]
    label: >-
      [[[

      /* BWC_I18N */

      const __bwcTranslatedResult = (() => {

        const e = states[variables.entity_id];
        if (!e) return '';
        if (e.state === 'unavailable' || e.state === 'unknown') return 'Niet beschikbaar';
        return e.state === 'on' ? 'Aan' : 'Uit';

      })();

      return window.bestwaySpaTranslate ?
      window.bestwaySpaTranslate(__bwcTranslatedResult, hass.locale?.language ||
      hass.language || "nl") : __bwcTranslatedResult;

      ]]]
    tap_action:
      action: javascript
      javascript: >-
        [[[

        /* BWC_I18N */

        const __bwcTranslatedResult = (() => {

          if (states[variables.entity_id]) {
            helpers.runAction({action: 'toggle', entity: variables.entity_id});
          }

        })();

        return window.bestwaySpaTranslate ?
        window.bestwaySpaTranslate(__bwcTranslatedResult, hass.locale?.language
        || hass.language || "nl") : __bwcTranslatedResult;

        ]]]
    hold_action:
      action: javascript
      javascript: >-
        [[[

        /* BWC_I18N */

        const __bwcTranslatedResult = (() => {

          if (states[variables.entity_id]) {
            helpers.runAction({action: 'more-info', entity: variables.entity_id});
          }

        })();

        return window.bestwaySpaTranslate ?
        window.bestwaySpaTranslate(__bwcTranslatedResult, hass.locale?.language
        || hass.language || "nl") : __bwcTranslatedResult;

        ]]]
    styles:
      card:
        - display: >-
            [[[

            /* BWC_I18N */

            const __bwcTranslatedResult = (() => {

              const e = states[variables.entity_id];
              return e && e.state !== 'unavailable' ? 'block' : 'none';

            })();

            return window.bestwaySpaTranslate ?
            window.bestwaySpaTranslate(__bwcTranslatedResult,
            hass.locale?.language || hass.language || "nl") :
            __bwcTranslatedResult;

            ]]]
        - min-height: 112px
        - padding: 16px 14px 14px
        - border-radius: 22px
        - border: >-
            [[[

            /* BWC_I18N */

            const __bwcTranslatedResult = (() => {

              const e = states[variables.entity_id];
              const on = e && e.state === 'on';
              return on ? `1px solid rgba(${variables.accent_rgb},0.82)` : '1px solid rgba(255,255,255,0.10)';

            })();

            return window.bestwaySpaTranslate ?
            window.bestwaySpaTranslate(__bwcTranslatedResult,
            hass.locale?.language || hass.language || "nl") :
            __bwcTranslatedResult;

            ]]]
        - background: >-
            [[[

            /* BWC_I18N */

            const __bwcTranslatedResult = (() => {

              const e = states[variables.entity_id];
              const on = e && e.state === 'on';
              return on
                ? `linear-gradient(145deg, rgba(${variables.accent_rgb},0.82), rgba(${variables.accent_rgb},0.44) 58%, rgba(6,39,57,0.96))`
                : 'linear-gradient(155deg, rgba(42,96,129,0.96), rgba(20,58,83,0.99))';

            })();

            return window.bestwaySpaTranslate ?
            window.bestwaySpaTranslate(__bwcTranslatedResult,
            hass.locale?.language || hass.language || "nl") :
            __bwcTranslatedResult;

            ]]]
        - box-shadow: >-
            [[[

            /* BWC_I18N */

            const __bwcTranslatedResult = (() => {

              const e = states[variables.entity_id];
              const on = e && e.state === 'on';
              return on
                ? `0 10px 30px rgba(0,0,0,0.30), 0 0 26px rgba(${variables.accent_rgb},0.15)`
                : '0 9px 24px rgba(0,0,0,0.19)';

            })();

            return window.bestwaySpaTranslate ?
            window.bestwaySpaTranslate(__bwcTranslatedResult,
            hass.locale?.language || hass.language || "nl") :
            __bwcTranslatedResult;

            ]]]
      grid:
        - grid-template-areas: '"i" "n" "l"'
        - grid-template-columns: 1fr
        - grid-template-rows: 48px min-content min-content
      img_cell:
        - width: 46px
        - height: 46px
        - border-radius: 15px
        - justify-self: center
        - background: >-
            [[[

            /* BWC_I18N */

            const __bwcTranslatedResult = (() => {

              const e = states[variables.entity_id];
              return e && e.state === 'on' ? `rgba(${variables.accent_rgb},0.15)` : 'rgba(255,255,255,0.075)';

            })();

            return window.bestwaySpaTranslate ?
            window.bestwaySpaTranslate(__bwcTranslatedResult,
            hass.locale?.language || hass.language || "nl") :
            __bwcTranslatedResult;

            ]]]
      icon:
        - width: 25px
        - color: >-
            [[[

            /* BWC_I18N */

            const __bwcTranslatedResult = (() => {

              const e = states[variables.entity_id];
              return e && e.state === 'on' ? variables.accent : 'rgba(232,238,246,0.70)';

            })();

            return window.bestwaySpaTranslate ?
            window.bestwaySpaTranslate(__bwcTranslatedResult,
            hass.locale?.language || hass.language || "nl") :
            __bwcTranslatedResult;

            ]]]
      name:
        - margin-top: 9px
        - font-size: 12px
        - font-weight: 700
      label:
        - margin-top: 3px
        - font-size: 10px
        - color: rgba(211,220,232,0.72)
  spa_micro_button:
    show_icon: true
    show_name: false
    show_state: false
    styles:
      card:
        - width: 52px
        - height: 52px
        - border-radius: 17px
        - border: 1px solid rgba(70,193,245,0.42)
        - background: linear-gradient(180deg, rgba(20,123,195,0.96), rgba(8,78,132,0.99))
        - box-shadow: 0 8px 24px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.075)
      icon:
        - width: 24px
        - color: rgba(245,248,252,0.86)
views:
  - title: Lay-Z-Spa
    path: layzspa
    icon: mdi:hot-tub
    background: >-
      var(--bestway-view-background, radial-gradient(circle at 84% 14%,
      rgba(0,182,150,.22), transparent 34%), radial-gradient(circle at 18% 10%,
      rgba(50,150,222,.14), transparent 28%), linear-gradient(135deg,
      rgba(19,63,92,.88) 0%, rgba(13,44,67,.88) 52%, rgba(17,83,76,.84) 100%),
      var(--primary-background-color))
    type: custom:grid-layout
    layout:
      margin: 12px
      grid-gap: 16px
      grid-template-columns: minmax(0, 1.55fr) minmax(320px, 0.75fr)
      grid-template-areas: |
        "appearance appearance"
        "header header"
        "hero diagnostics"
        "controls diagnostics"
        "secondary diagnostics"
        "history history"
        "planner planner"
      mediaquery:
        '(max-width: 900px)':
          margin: 8px
          grid-gap: 12px
          grid-template-columns: 100%
          grid-template-areas: |
            "appearance"
            "header"
            "hero"
            "controls"
            "secondary"
            "history"
            "planner"
            "diagnostics"
    cards:
      - type: custom:bestway-layout-picker
        view_layout:
          grid-area: appearance
      - type: custom:bestway-language-card
        view_layout:
          grid-area: header
        card:
          type: custom:button-card
          template: spa_surface
          triggers_update:
            - binary_sensor.bestway_lay_z_spa_spa_verbonden
            - binary_sensor.bestway_lay_z_spa_spa_gebruiksklaar
            - sensor.bestway_lay_z_spa_wifi_signaal
            - sensor.bestway_lay_z_spa_firmware
          view_layout:
            grid-area: header
          styles:
            card:
              - min-height: 96px
              - padding: 22px 26px
            grid:
              - grid-template-areas: '"title status" "subtitle status"'
              - grid-template-columns: 1fr auto
              - grid-template-rows: min-content min-content
            custom_fields:
              title:
                - justify-self: start
                - align-self: end
              subtitle:
                - justify-self: start
                - align-self: start
                - margin-top: 26px
              status:
                - justify-self: start
                - align-self: start
                - margin-top: -0px
          custom_fields:
            title: >-
              [[[

              /* BWC_I18N */

              const __bwcTranslatedResult = (() => {

                return `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><img src="data:image/png;base64," alt="PtW Spa Control" width="42" height="42" style="display:block;object-fit:contain;flex-shrink:0"/><span style="font-size:24px;font-weight:800;letter-spacing:-0.5px;line-height:1.05">Lay-Z-Spa</span></div>`;

              })();

              return window.bestwaySpaTranslate ?
              window.bestwaySpaTranslate(__bwcTranslatedResult,
              hass.locale?.language || hass.language || "nl") :
              __bwcTranslatedResult;

              ]]]
            subtitle: >-
              [[[

              /* BWC_I18N */

              const __bwcTranslatedResult = (() => {

                const fw = states['sensor.bestway_lay_z_spa_firmware']?.state;
                const fwtxt = fw && !['unknown','unavailable'].includes(fw) ? ` · firmware ${fw}` : '';
                return `<div style="margin-top:6px;font-size:11px;font-weight:550;letter-spacing:1.15px;color:rgba(166,214,237,.78);text-transform:uppercase">MIAMI2021 · 6-wire Type1 ${fwtxt}</div>`;

              })();

              return window.bestwaySpaTranslate ?
              window.bestwaySpaTranslate(__bwcTranslatedResult,
              hass.locale?.language || hass.language || "nl") :
              __bwcTranslatedResult;

              ]]]
            status: >-
              [[[

              /* BWC_I18N */

              const __bwcTranslatedResult = (() => {

                const connected = states['binary_sensor.bestway_lay_z_spa_spa_verbonden']?.state === 'on';
                const ready = states['binary_sensor.bestway_lay_z_spa_spa_gebruiksklaar']?.state === 'on';
                const rssi = Number(states['sensor.bestway_lay_z_spa_wifi_signaal']?.state);
                const c = connected ? (ready ? '#4de19b' : '#f7b955') : '#ff5d69';
                const txt = connected ? (ready ? 'SPA ONLINE' : 'WACHT OP DATA') : 'SPA OFFLINE';
                const wifi = Number.isFinite(rssi) ? `${Math.round(rssi)} dBm` : 'WiFi —';
                return `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
                  <div style="padding:8px 11px;border-radius:999px;background:rgba(26,89,119,.34);border:1px solid rgba(74,191,235,.18);font-size:10px;font-weight:700;color:rgba(235,240,246,.86)">${wifi}</div>
                  <div style="display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:999px;background:${c}14;border:1px solid ${c}3c;color:${c};font-size:10px;font-weight:800;letter-spacing:.75px"><span style="width:7px;height:7px;border-radius:50%;background:${c};box-shadow:0 0 12px ${c}"></span>${txt}</div>
                </div>`;

              })();

              return window.bestwaySpaTranslate ?
              window.bestwaySpaTranslate(__bwcTranslatedResult,
              hass.locale?.language || hass.language || "nl") :
              __bwcTranslatedResult;

              ]]]
      - type: custom:bestway-language-card
        view_layout:
          grid-area: hero
        card:
          type: custom:button-card
          template: spa_surface
          entity: sensor.bestway_lay_z_spa_watertemperatuur
          triggers_update:
            - number.bestway_lay_z_spa_doeltemperatuur
            - switch.bestway_lay_z_spa_spa_aan
            - switch.bestway_lay_z_spa_heater
            - binary_sensor.bestway_lay_z_spa_daadwerkelijk_verwarmen
            - binary_sensor.bestway_lay_z_spa_spa_verbonden
            - binary_sensor.bestway_lay_z_spa_spa_gebruiksklaar
            - switch.bestway_lay_z_spa_filter
            - switch.bestway_lay_z_spa_bubbels
            - switch.bestway_lay_z_spa_jets
          view_layout:
            grid-area: hero
          styles:
            card:
              - min-height: 430px
              - padding: 24px
              - position: relative
              - isolation: isolate
              - background: >-
                  [[[

                  /* BWC_I18N */

                  const __bwcTranslatedResult = (() => {

                    const heating = states['binary_sensor.bestway_lay_z_spa_daadwerkelijk_verwarmen']?.state === 'on';
                    const heater = states['switch.bestway_lay_z_spa_heater']?.state === 'on';
                    if (heating) return 'radial-gradient(circle at 50% 36%, rgba(255,145,55,0.24), rgba(27,73,101,0.97) 43%, rgba(12,40,58,0.99) 80%)';
                    if (heater) return 'radial-gradient(circle at 50% 36%, rgba(247,185,85,0.12), rgba(27,73,101,0.97) 44%, rgba(12,40,58,0.99) 80%)';
                    return 'radial-gradient(circle at 50% 34%, rgba(24,170,226,0.16), rgba(27,73,101,0.97) 44%, rgba(12,40,58,0.99) 80%)';

                  })();

                  return window.bestwaySpaTranslate ?
                  window.bestwaySpaTranslate(__bwcTranslatedResult,
                  hass.locale?.language || hass.language || "nl") :
                  __bwcTranslatedResult;

                  ]]]
              - box-shadow: >-
                  [[[

                  /* BWC_I18N */

                  const __bwcTranslatedResult = (() => {

                    const heating = states['binary_sensor.bestway_lay_z_spa_daadwerkelijk_verwarmen']?.state === 'on';
                    return heating
                      ? '0 20px 58px rgba(0,8,18,.38), 0 0 46px rgba(255,132,43,.16), inset 0 1px 0 rgba(77,203,248,.07)'
                      : '0 20px 54px rgba(0,8,18,.34), 0 0 34px rgba(22,158,213,.10), inset 0 1px 0 rgba(77,203,248,.07)';

                  })();

                  return window.bestwaySpaTranslate ?
                  window.bestwaySpaTranslate(__bwcTranslatedResult,
                  hass.locale?.language || hass.language || "nl") :
                  __bwcTranslatedResult;

                  ]]]
            grid:
              - grid-template-areas: >-
                  "eyebrow" "temperature" "mode" "target" "statusline"
                  "controls"
              - grid-template-columns: 1fr
              - grid-template-rows: >-
                  min-content 1fr min-content min-content min-content
                  min-content
            custom_fields:
              eyebrow:
                - justify-self: center
                - z-index: 2
              temperature:
                - justify-self: center
                - align-self: center
                - z-index: 2
              mode:
                - justify-self: center
                - z-index: 2
              target:
                - justify-self: center
                - z-index: 2
              statusline:
                - justify-self: center
                - width: 100%
                - z-index: 2
              controls:
                - justify-self: center
                - width: 100%
                - z-index: 2
              waves:
                - position: absolute
                - left: 0
                - right: 0
                - bottom: 0
                - height: 105px
                - width: 100%
                - pointer-events: none
                - opacity: 0.86
                - z-index: 1
              ambient:
                - position: absolute
                - inset: 0
                - pointer-events: none
                - overflow: hidden
                - z-index: 0
          custom_fields:
            waves: >-
              [[[

              /* BWC_I18N */

              const __bwcTranslatedResult = (() => {

                const power = states['switch.bestway_lay_z_spa_spa_aan']?.state === 'on';
                const speed1 = power ? '8s' : '20s';
                const speed2 = power ? '11s' : '26s';
                return `
                  <style>
                    @keyframes spaWaveA { from { transform:translateX(0); } to { transform:translateX(-50%); } }
                    @keyframes spaWaveB { from { transform:translateX(-50%); } to { transform:translateX(0); } }
                  </style>
                  <div style="position:absolute;inset:0;overflow:hidden">
                    <svg viewBox="0 0 1800 110" preserveAspectRatio="none"
                         style="position:absolute;width:200%;height:100%;left:0;bottom:0;animation:spaWaveA ${speed1} linear infinite">
                      <path d="M0 55 C150 24 300 80 450 48 S750 21 900 53 S1200 83 1350 49 S1650 22 1800 55"
                            fill="none" stroke="rgba(65,210,255,.88)" stroke-width="2"/>
                      <path d="M0 78 C170 43 330 94 510 63 S760 38 900 69 S1220 95 1390 64 S1640 42 1800 78"
                            fill="none" stroke="rgba(24,139,221,.72)" stroke-width="2"/>
                    </svg>
