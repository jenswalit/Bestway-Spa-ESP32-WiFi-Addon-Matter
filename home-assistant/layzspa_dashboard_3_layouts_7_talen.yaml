                  else if (rssi >= -67) { quality = 'Goed'; wc = '#70d6a5'; }
                  else if (rssi >= -75) { quality = 'Matig'; wc = '#f1b85b'; }
                  else { quality = 'Zwak'; wc = '#ff6d72'; }
                }
                const heapRaw = Number(states['sensor.bestway_lay_z_spa_vrij_geheugen']?.state);
                const heapUnit = states['sensor.bestway_lay_z_spa_vrij_geheugen']?.attributes?.unit_of_measurement || '';
                const heap = Number.isFinite(heapRaw) ? `${Math.round(heapRaw * 10) / 10}${heapUnit ? ' ' + heapUnit : ''}` : val('sensor.bestway_lay_z_spa_vrij_geheugen');
                const row = (label, value, extra='') => `<div
              style="display:grid;grid-template-columns:120px
              1fr;gap:18px;align-items:center;padding:11px 0;border-bottom:1px
