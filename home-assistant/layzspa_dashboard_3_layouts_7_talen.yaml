                  ${row('WiFi / RSSI', Number.isFinite(rssi) ? `${Math.round(rssi)} dBm` : '—', Number.isFinite(rssi) ? ` <span style="color:${wc};font-weight:760">· ${quality}</span>` : '')}
                  ${row('Uptime', val('sensor.bestway_lay_z_spa_uptime'))}
                  ${row('Firmware', val('sensor.bestway_lay_z_spa_firmware'))}
                  ${row('Free heap', heap)}
                  ${row('Model', 'MIAMI2021')}
                  ${row('Protocol', '6-wire Type1')}
                  ${row('AirJet', (states['switch.bestway_lay_z_spa_bubbels'] && !['unknown','unavailable'].includes(states['switch.bestway_lay_z_spa_bubbels'].state)) ? 'Aanwezig' : 'Niet aanwezig')}
                  ${row('HydroJets', (states['switch.bestway_lay_z_spa_jets'] && !['unknown','unavailable'].includes(states['switch.bestway_lay_z_spa_jets'].state)) ? 'Aanwezig' : 'Niet aanwezig')}
                </div>`;

