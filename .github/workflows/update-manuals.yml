name: Update reviewed user manuals

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-manuals.yml'

permissions:
  contents: write

concurrency:
  group: update-reviewed-manuals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify reviewed manuals
        run: python3 .github/manual-update/reconstruct.py
      - name: Commit updated Dutch and English Word and PDF manuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PtW_Spa_Control_Handleiding.docx docs/PtW_Spa_Control_Handleiding.pdf docs/PtW_Spa_Control_User_Manual_EN.docx docs/PtW_Spa_Control_User_Manual_EN.pdf
          if git diff --cached --quiet; then
            echo "Manuals already match the reviewed documents."
          else
            git commit -m "Document 45-second LazySpaSetup wait on first connection in both manuals"
            git push origin HEAD:main
          fi
